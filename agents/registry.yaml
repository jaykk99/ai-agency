# ai-agency agent registry — EXACTLY 50 agents. Status: working = module exists, defined = spec only, module null.
# Dry-run only until Jay approves live sends. See README.md and docs/ROSTER.md.
agents:
- id: ops-manager
  name: Ops Manager
  business: shared
  role: operations
  description: 'Owns the daily run across all 7 businesses: queues work, watches agent
    health, and keeps the dry-run/live boundary intact.'
  inputs:
  - registry.yaml
  - businesses.yaml
  - daily queues
  tools:
  - runner
  - guard
  - reporting
  outputs:
  - daily run plan
  - agent health summary
  escalation: Escalates to Jay when any agent is blocked, a queue stalls, or a live
    send is requested.
  status: working
  module: agents.ops_manager
- id: finance-controller
  name: Finance Controller
  business: shared
  role: finance
  description: 'Owns money discipline across the agency: tracks revenue, costs, and
    margins per business and flags anything off plan.'
  inputs:
  - invoices
  - payments
  - rate cards
  tools:
  - bookkeeper
  - reporting
  outputs:
  - finance summary
  - margin flags
  escalation: Escalates to Jay before any spend, refund, or price change.
  status: defined
  module: null
- id: quality-control
  name: Quality Control
  business: shared
  role: quality
  description: 'Reviews agent output before it reaches a customer: checks tone, accuracy,
    pricing, and standing-rule compliance.'
  inputs:
  - draft outputs
  - standing rules
  tools:
  - guard
  - reporting
  outputs:
  - pass/fail review
  - fix list
  escalation: Escalates to Jay when output is wrong in a way no agent can fix cleanly.
  status: defined
  module: null
- id: compliance-guard
  name: Compliance Guard
  business: shared
  role: compliance
  description: 'Enforces the standing rules on every send: own-inbox only, no info@,
    no AI label, Bnb scope, and the Integrity Roofing block.'
  inputs:
  - outbound drafts
  - businesses.yaml
  - standing rules
  tools:
  - guard
  - gmail_read
  - outlook_read
  outputs:
  - allow/hold decision
  - hold reason
  escalation: Escalates to Jay when a rule conflict needs his call instead of a hold.
  status: working
  module: agents.compliance_guard
- id: lead-source-hunter
  name: Lead Source Hunter
  business: shared
  role: lead sourcing
  description: 'Finds new places to hunt leads for all businesses: directories, listing
    sites, and local sources worth mining.'
  inputs:
  - business profiles
  - web search
  tools:
  - websearch
  - bro
  outputs:
  - lead source list
  - source quality notes
  escalation: Escalates to Jay before paying for or signing up to any lead source.
  status: defined
  module: null
- id: reporting
  name: Reporting
  business: shared
  role: reporting
  description: 'Turns run logs into a plain daily report: what went out, what came
    back, what is blocked, and what needs Jay.'
  inputs:
  - run logs
  - inbox replies
  tools:
  - reporting
  - guard
  outputs:
  - daily report
  escalation: Escalates to Jay when numbers look wrong or a report cannot be reconciled.
  status: working
  module: agents.reporting
- id: ads-manager
  name: Ads Manager
  business: shared
  role: advertising
  description: Plans and tracks paid promotion where allowed; Winnipeg Web Works is
    organic-only and never gets paid ads.
  inputs:
  - business profiles
  - ad performance
  tools:
  - websearch
  - reporting
  outputs:
  - ad plan
  - ad performance summary
  escalation: Escalates to Jay before any ad spend, boost, or campaign launch.
  status: defined
  module: null
- id: invoicing-tracker
  name: Invoicing Tracker
  business: shared
  role: invoicing
  description: 'Tracks every invoice from quote to paid: what is owed, what is overdue,
    and what needs chasing.'
  inputs:
  - quotes
  - invoices
  - payments
  tools:
  - bookkeeper
  - reporting
  outputs:
  - invoice status
  - overdue list
  escalation: Escalates to Jay when an invoice is disputed or a payment is missing.
  status: defined
  module: null
- id: bookkeeper
  name: Bookkeeper
  business: shared
  role: bookkeeping
  description: 'Keeps the books straight per business: records income and expenses
    and reconciles them against invoices.'
  inputs:
  - invoices
  - payments
  - receipts
  tools:
  - bookkeeper
  outputs:
  - ledger entries
  - reconciliation summary
  escalation: Escalates to Jay when books do not reconcile or a record is missing.
  status: defined
  module: null
